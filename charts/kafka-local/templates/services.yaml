apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka-local
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: internal
      port: 9092
      targetPort: internal
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka-local
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: internal
      port: 9092
      targetPort: internal
    {{- if .Values.external.enabled }}
    - name: external
      port: {{ .Values.external.port }}
      targetPort: external
    {{- end }}

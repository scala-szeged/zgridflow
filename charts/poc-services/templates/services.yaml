{{- range $service, $port := dict "api" 8080 "gateway" 4000 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- end }}
